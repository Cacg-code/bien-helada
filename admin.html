<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050d18">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel · Bien Helada</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238fe3ff'/%3E%3Cpath d='M16 46V30M28 46V20M40 46V34M52 46V14' stroke='%2306101c' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <section class="login" id="login">
    <form class="login-card" id="loginForm">
      <div class="logo"><span>❄</span></div>
      <h1>Panel del negocio</h1>
      <p id="loginHint">Ingresa tu clave de administrador.</p>
      <input id="pass" type="password" autocomplete="current-password" placeholder="Clave" required>
      <button class="btn btn-ice" type="submit">Entrar</button>
      <div class="err" id="loginErr" hidden></div>
      <a href="./" class="back">← Ir a la tienda</a>
    </form>
  </section>

  <div class="app" id="app" hidden>
    <aside class="side">
      <div class="side-brand"><span>❄</span><b id="brand">Bien Helada</b></div>
      <nav class="tabs" id="tabs">
        <button data-tab="resumen" class="on"><i><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-7M22 20H2"/></svg></i><span>Resumen</span></button>
        <button data-tab="pedidos"><i><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></svg></i><span>Pedidos</span><b class="dot" id="pendDot" hidden>0</b></button>
        <button data-tab="productos"><i><svg viewBox="0 0 24 24"><path d="M10 2h4v4l2 3v12a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9l2-3zM8 13h8"/></svg></i><span>Productos</span></button>
        <button data-tab="ajustes"><i><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></i><span>Ajustes</span></button>
      </nav>
      <a class="side-link" href="./" target="_blank">Ver tienda ↗</a>
    </aside>

    <main class="main">
      <header class="bar">
        <div class="bar-t">
          <h2 id="tabTitle">Resumen</h2>
          <span class="sync"><button class="store-pill" id="storePill" hidden></button><span id="sync">—</span></span>
        </div>
        <div class="bar-actions">
          <button class="ib" id="refresh" title="Actualizar" aria-label="Actualizar">↻</button>
          <button class="ib" id="logout" title="Salir" aria-label="Salir">⏻</button>
        </div>
      </header>
      <div class="demo-banner" id="demoBanner" hidden>Modo demo: datos de ejemplo, solo en este navegador. <button id="resetDemo">Reiniciar demo</button></div>

      <section class="view" id="v-resumen"></section>
      <section class="view" id="v-pedidos" hidden></section>
      <section class="view" id="v-productos" hidden></section>
      <section class="view" id="v-ajustes" hidden></section>
    </main>
  </div>

  <div class="modal" id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/api.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
